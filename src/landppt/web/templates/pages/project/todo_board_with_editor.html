<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面生成 - {{ todo_board.title }}</title>
    <script src="/static/js/shared/unattended_monitor.js?v=20261012"></script>
    <!-- CodeMirror CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/dracula.min.css">
    <link rel="stylesheet" href="/static/antd/app.css?v=0.4.0-editor-integration-h">
</head>

<body class="landppt-generator">
    <div id="antdRoot"><p role="status">正在加载生成工作区…</p></div>
    {% import "components/project/workspace_state.html" as ws with context %}
    <script id="antdData" type="application/json">{
        "page": "generator-workspace",
        "projectId": {{ todo_board.task_id | tojson }},
        "title": {{ todo_board.title | tojson }},
        "generationMode": {{ (project.project_metadata.get('generation_mode', 'freeform') if project and project.project_metadata else 'freeform') | tojson }},
        "unattendedActive": {{ (unattended_active | default(false)) | tojson }},
        "workspace": {{ ws.state | tojson }},
        "slideTitles": {{ (project.outline.slides | map(attribute='title', default='未命名页面') | list if project and project.outline and project.outline.slides else []) | tojson }},
        "templateInitial": {
            "topic": {{ (project.topic if project else '') | tojson }},
            "templateMode": {{ (project.project_metadata.get('template_mode', '') if project and project.project_metadata else '') | tojson }}
        },
        "generationInitial": {
            "slides": {{ (project.slides_data if project and project.slides_data else []) | tojson }},
            "total": {{ (project.outline.slides | length if project and project.outline and project.outline.slides else 0) | tojson }},
            "status": {{ (project.status if project else 'draft') | tojson }}
        }
    }</script>
    <script type="module" src="/static/antd/app.js?v=0.4.0-editor-integration-h"></script>
    <!-- CodeMirror JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/css/css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/htmlmixed/htmlmixed.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/edit/closetag.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/edit/closebrackets.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/fold/foldcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/fold/foldgutter.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/fold/xml-fold.min.js"></script>

</body>

</html>
