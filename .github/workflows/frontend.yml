name: Frontend validation

on:
  push:
    branches: [main, master]
    paths: ['frontend/**', 'src/landppt/web/**', 'pyproject.toml', 'tests/test_app_ui.py', 'tests/test_antd*.py', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['frontend/**', 'src/landppt/web/**', 'pyproject.toml', 'tests/test_app_ui.py', 'tests/test_antd*.py', '.github/workflows/frontend.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend --no-audit --no-fund
      - run: npm run build --prefix frontend
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest jinja2 playwright build
      - run: python -m build --outdir artifacts/frontend-release
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest tests/test_app_ui.py tests/test_antd_ui.py tests/test_antd_settings_performance_ui.py tests/test_antd_settings_models_ui.py tests/test_antd_navigation_ui.py tests/test_antd_projects_ui.py tests/test_antd_account_ui.py tests/test_antd_admin_ui.py tests/test_antd_admin_management_ui.py tests/test_antd_community_ui.py tests/test_antd_images_ui.py tests/test_antd_templates_ui.py tests/test_antd_creation_research_ui.py tests/test_antd_home_generator_ui.py tests/test_antd_generator_skeleton_ui.py tests/test_antd_presentation_ui.py tests/test_antd_todo_ui.py tests/test_antd_editor_ui.py tests/test_antd_editor_media_ui.py tests/test_antd_editor_context_ui.py tests/test_antd_editor_export_ui.py tests/test_antd_remaining_ui.py tests/test_template_package_workspace_ui.py -q
